import org.jetbrains.intellij.platform.gradle.TestFrameworkType
import org.jetbrains.intellij.platform.gradle.tasks.VerifyPluginTask

plugins {
    id 'java'
    id 'idea'
    id 'de.schablinski.activejdbc-gradle-plugin' version '3.0.0'
    // 2.x platform plugin replaces legacy `org.jetbrains.intellij` 0.7.3.
    id 'org.jetbrains.intellij.platform' version '2.16.0'
}

group 'edu.unlv.cs.evol'
version '1.0-SNAPSHOT'

java {
    toolchain {
        // 2024.x platform requires JDK 17.
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url "https://jitpack.io"
    }
    // 2.x model: the platform plugin uses its own repository handler.
    intellijPlatform {
        defaultRepositories()
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.slf4j:slf4j-api:1.7.25'
        force 'org.slf4j:slf4j-simple:1.7.25'
        force 'org.eclipse.platform:org.eclipse.core.runtime:3.20.0'
        force 'org.eclipse.platform:org.eclipse.core.contenttype:3.7.800'
        force 'org.eclipse.platform:org.eclipse.core.jobs:3.10.1000'
        force 'org.eclipse.platform:org.eclipse.core.resources:3.13.900'
        force 'org.eclipse.platform:org.eclipse.equinox.common:3.14.0'
        force 'org.eclipse.platform:org.eclipse.equinox.preferences:3.8.100'
        // github-api 1.135's POM pins commons-lang3:3.9 but its bytecode calls
        // prependIfMissing(String, CharSequence, CharSequence...) which only exists in 3.10+.
        force 'org.apache.commons:commons-lang3:3.12.0'
    }
}

// SLF4J/Log4j dependency conflict resolution
configurations.all {
    exclude group: 'org.slf4j', module: 'log4j-over-slf4j'
    exclude group: 'org.slf4j', module: 'slf4j-log4j12'
}


dependencies {
    // 2.x platform / IDE + bundled plugins (replaces the old `intellij { ... }` block).
    intellijPlatform {
        intellijIdeaCommunity '2024.3.7'
        bundledPlugins 'Git4Idea', 'com.intellij.java'
        // Light-fixture test support; on plugin 2.x the test frameworks are
        // explicit dependencies. LightJavaCodeInsightFixtureTestCase lives in
        // the Java plugin's test framework, on top of the platform one.
        testFramework TestFrameworkType.Platform.INSTANCE
        testFramework TestFrameworkType.Plugin.Java.INSTANCE
    }

    implementation fileTree(dir: 'lib', include: ['*.jar'])
    // `compile` removed in Gradle 7+: replaced with `implementation`.
    implementation group: 'org.eclipse.jgit', name: 'org.eclipse.jgit', version: '5.10.0.202012080955-r'
    implementation group: 'com.github.tsantalis', name: 'refactoring-miner', version: '2.1.0'
    // RefactoringMiner uses commons-text at runtime (LevenshteinDistance) but
    // doesn't declare it transitively; the removed IntelliMerge fat jar used
    // to mask this by bundling commons-text 1.5. Same version, now explicit.
    implementation 'org.apache.commons:commons-text:1.5'
    implementation 'com.google.googlejavaformat:google-java-format:1.7'
    implementation group: 'io.reflectoring.diffparser', name: 'diffparser', version: '1.4'
    implementation 'org.eclipse.jdt:org.eclipse.jdt.core:3.24.0'
    runtimeOnly group: 'mysql', name: 'mysql-connector-java', version: '8.0.16'
    implementation group: 'org.javalite', name: 'activejdbc', version: '2.2'
    implementation group: 'org.javalite', name: 'activejdbc-instrumentation', version: '2.2'
    implementation 'org.kohsuke:github-api:1.135'
    // CommentRemover dropped: its only consumer was the dead removeAllComments
    // helper deleted alongside the IntelliMerge fat jar.
    implementation 'commons-cli:commons-cli:1.4'

    // `testCompile` removed in Gradle 7+: replaced with `testImplementation`.
    testImplementation group: 'junit', name: 'junit', version: '4.12'
    testImplementation 'org.eclipse.jdt:org.eclipse.jdt.core:3.24.0'
    testImplementation group: 'org.eclipse.jgit', name: 'org.eclipse.jgit', version: '5.10.0.202012080955-r'
    testImplementation group: 'com.github.tsantalis', name: 'refactoring-miner', version: '2.0'
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '2.1.0'
}

// 2.x replaces the legacy `intellij { ... }` and `patchPluginXml { ... }` blocks
// with a single `intellijPlatform { pluginConfiguration { ... } }` block.
intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '243'
            untilBuild = '243.*'
        }
        changeNotes = """
          Add change notes here.<br>
          <em>most HTML tags may be used</em>"""
    }
    // CI gate: `verifyPlugin` runs the IntelliJ Plugin Verifier against the
    // IDEs recommended for the sinceBuild/untilBuild range above.
    // - The ActiveJDBC-instrumentation convertWith problem is ignored via
    //   .github/plugin-verifier-ignored-problems.txt (generated bytecode,
    //   never invoked, not an IntelliJ-API issue).
    // - Internal-API usages are reported but not gating: the four current
    //   usages (IdeEventQueue.flushQueue, ProjectUtil.openOrImport,
    //   Module.getModuleFile/getModuleFilePath) are documented in
    //   docs/migration-report.md §4.
    pluginVerification {
        failureLevel = [
            VerifyPluginTask.FailureLevel.COMPATIBILITY_PROBLEMS,
            VerifyPluginTask.FailureLevel.INVALID_PLUGIN,
        ]
        ignoredProblemsFile = file('.github/plugin-verifier-ignored-problems.txt')
        ides {
            recommended()
        }
    }
}


// Reset DB + kafka fixture + sandbox lock before an integration run, so the
// IDE Run-config "do reset, then runIde" workflow is a single click. Only
// fires when -Pmode=integration is set, so plain runIde (sandbox-IDE for
// AnAction debugging) is unaffected.
tasks.register('resetIntegrationFixtures', Exec) {
    description = 'Drop test DB, reset kafka to pinned SHA, clear sandbox lock.'
    group = 'verification'
    workingDir = project.projectDir
    commandLine 'bash', "${project.projectDir}/scripts/reset-integration-fixtures.sh"
    environment 'PROJECT_ROOT', project.projectDir.absolutePath
    // dataSet selects which bundled project/patch list to clone+run: 'sample'
    // (5-PR kafka, default) or 'complete' (full 9-project / 477-patch dataset).
    environment 'DATASET', (project.findProperty('dataSet') ?: 'sample').toString()
    onlyIf {
        project.hasProperty('mode') && project.findProperty('mode') == 'integration'
    }
}

tasks.named('runIde').configure {
    dependsOn 'resetIntegrationFixtures'
    jvmArgs '-Djava.awt.headless=true', '-Xss100m', '-Xmx16g', '-Drepatch.timeout.scenarioBudgetMs=9999999999999'
    // repro-mech experiment: forward the forced-abort mode to the pipeline JVM.
    if (project.hasProperty('forceAbort')) {
        jvmArgs "-Drepatch.forceAbort=${project.findProperty('forceAbort')}"
    }
    // base-compat: restrict resolution + verdict counting to 1.x semantics.
    if (project.hasProperty('baseCompat1x')) {
        jvmArgs "-Drepatch.baseCompat1x=${project.findProperty('baseCompat1x')}"
    }
    if (project.hasProperty("mode")) {
        Object x = project.findProperty("mode")
        Object y = project.findProperty("dataPath")
        Object z = project.findProperty("evaluationProject")
        // dataSet (optional, default 'sample'): 'sample' = 5-PR kafka set,
        // 'complete' = full dataset under resources/complete_data.
        Object w = project.findProperty("dataSet") ?: 'sample'
        args 'integration', x.toString(), y.toString(), z.toString(), w.toString()
    }
    else {
        doFirst { println "Use gradle runIde -Pmode=x where x='integration'" }
    }
}

tasks.named('buildSearchableOptions').configure { enabled = false }
